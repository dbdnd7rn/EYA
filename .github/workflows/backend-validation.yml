name: EYA Backend Validation

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-validation.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check index.js && node --check src/server-v2.js && node --check src/local-server.js
      - run: npm run test:security

  payments-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare/payments-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/cloudflare/payments-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate:local
